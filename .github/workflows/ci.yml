name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # macOS because the native modules (SQLCipher, Argon2, Whisper) and the
    # Electron build are macOS-only.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No cloud credentials are used here. Anything that would need a real
      # OpenRouter key is exercised against a stubbed provider instead.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
